<style>
/* ===========================================================================
 * Allegany Archive Kiosk - stylesheet
 *
 * Two rules drive everything here:
 *
 * 1. ONE z-index scale. The old sheet had values like 21521532530 and
 *    9999999999999999 fighting each other, which meant nobody could predict
 *    what would end up on top. Every layer is now a named custom property
 *    between 1 and 100.
 *
 * 2. Animate ONLY transform and opacity. Those two properties are handled by
 *    the compositor and never trigger layout or paint. The old transitions
 *    animated `left` and `right`, which forces a full layout on every single
 *    frame of an 8-second transition - that is the stutter.
 * =========================================================================*/

:root {
  /* Layer scale: back to front. */
  --z-backdrop:  1;
  --z-stage:    10;
  --z-blurb:    20;
  --z-caption:  30;
  --z-toolbar:  40;
  --z-panel:    50;
  --z-banner:   60;
  --z-toast:    70;
  --z-curtain:  80;
  --z-hud:      90;

  /* Palette */
  --ink:        #ffffff;
  --ink-soft:   rgba(255, 255, 255, 0.72);
  --ink-faint:  rgba(255, 255, 255, 0.45);
  --surface:    rgba(12, 14, 20, 0.92);
  --surface-2:  rgba(255, 255, 255, 0.08);
  --line:       rgba(255, 255, 255, 0.16);
  --accent:     #7cb8ff;

  /* Motion. Overridden at runtime from the TransitionMs setting. */
  --transition:      1200ms;
  --transition-ease: cubic-bezier(0.33, 0.02, 0.18, 1);

  /* Geometry */
  --toolbar-h:  88px;
  --panel-h:    min(38vh, 340px);
  --radius:     14px;

  --font: "Playfair Display", Georgia, "Times New Roman", serif;
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  padding: 0;
  background: #000;
  color: var(--ink);
  font-family: var(--font-ui);
  overflow: hidden;
  /* A kiosk should never rubber-band, text-select or show a callout menu. */
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}

.app {
  position: fixed;
  inset: 0;
  overflow: hidden;
}

/* ===========================================================================
 * Backdrop - blurred, over-scaled fill so the photo never sits on hard black
 * =========================================================================*/

.backdrop {
  position: absolute;
  inset: 0;
  z-index: var(--z-backdrop);
  background: #000;
  /* Isolates the blur so it cannot force repaints of anything above it. */
  contain: strict;
}

.backdrop-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  /* Over-scaled so the blur's soft edge never reveals the black behind it. */
  transform: scale(1.18);
  filter: blur(28px) brightness(0.55);
  transition: opacity var(--transition) var(--transition-ease);
  will-change: opacity;
}

.backdrop-img.is-active { opacity: 1; }

/* ===========================================================================
 * Stage - the photo itself
 * =========================================================================*/

.stage {
  position: absolute;
  inset: 0;
  bottom: var(--toolbar-h);
  z-index: var(--z-stage);
  display: grid;
  place-items: center;
  contain: strict;
}

.slide {
  grid-area: 1 / 1;                 /* both layers stack in the same cell */
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
  opacity: 0;
  transform: translate3d(0, 0, 0);
  will-change: opacity, transform;
  /* Sharper downscaling of large archival scans. */
  image-rendering: -webkit-optimize-contrast;
}

.slide.is-active { opacity: 1; }

/* Transition classes are added by the slideshow engine, never inline styles. */
.slide.is-animating,
.backdrop-img.is-animating {
  transition: opacity var(--transition) var(--transition-ease),
              transform var(--transition) var(--transition-ease);
}

/* Off-stage resting positions. The engine picks one based on direction. */
.slide.from-right { transform: translate3d(6%, 0, 0) scale(1.02); }
.slide.from-left  { transform: translate3d(-6%, 0, 0) scale(1.02); }
.slide.to-left    { transform: translate3d(-6%, 0, 0) scale(0.99); }
.slide.to-right   { transform: translate3d(6%, 0, 0) scale(0.99); }

/*
 * Make room for the details panel.
 *
 * Shrinking the photo with a transform needs a scale factor that happens to
 * suit one screen height - at 1366x768 a scale of 0.72 still left the photo
 * running 138px behind the panel. Moving the stage's bottom edge instead lets
 * `object-fit: contain` size the photo correctly at ANY viewport, with no
 * magic numbers to re-tune.
 *
 * This does animate layout, unlike the slide transition - but it runs once
 * when someone opens the panel, not sixty times a second, so it is the right
 * trade for being correct on every screen.
 */
.stage { transition: bottom 420ms var(--transition-ease); }

.app.panel-open .stage {
  bottom: calc(var(--toolbar-h) + var(--panel-h));
}

/* ===========================================================================
 * Caption - photo title, bottom-left
 * =========================================================================*/

.caption {
  position: absolute;
  left: 20px;
  bottom: calc(var(--toolbar-h) + 14px);
  z-index: var(--z-caption);
  max-width: min(70vw, 900px);
  margin: 0;
  padding: 8px 14px;
  border: 0;
  border-radius: var(--radius);
  background: rgba(0, 0, 0, 0.42);
  backdrop-filter: blur(10px);
  color: var(--ink);
  font-family: var(--font);
  font-size: clamp(18px, 2.4vw, 30px);
  font-weight: 700;
  line-height: 1.2;
  text-align: left;
  text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
  cursor: pointer;
  transition: opacity 300ms ease;
  /* Keep long titles on one tidy line. */
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.app.panel-open .caption { opacity: 0; pointer-events: none; }

/* ===========================================================================
 * Blurb - the standing description, bottom-right
 * =========================================================================*/

.blurb {
  position: absolute;
  right: 20px;
  bottom: calc(var(--toolbar-h) + 14px);
  z-index: var(--z-blurb);
  max-width: min(34vw, 460px);
  padding: 12px 16px;
  border-radius: var(--radius);
  background: rgba(0, 0, 0, 0.42);
  backdrop-filter: blur(10px);
  color: var(--ink-soft);
  font-size: 15px;
  line-height: 1.45;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 600ms ease, transform 600ms var(--transition-ease);
  /* Never let a long description eat the screen. */
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.blurb.is-visible { opacity: 1; transform: translateY(0); }
.app.panel-open .blurb { opacity: 0; }

/* ===========================================================================
 * Details panel
 * =========================================================================*/

.info-panel {
  position: absolute;
  left: 0;
  right: 0;
  bottom: var(--toolbar-h);
  z-index: var(--z-panel);
  height: 0;
  overflow: hidden;
  background: var(--surface);
  backdrop-filter: blur(20px);
  border-top: 1px solid var(--line);
  transition: height 420ms var(--transition-ease);
}

.info-panel.is-open { height: var(--panel-h); }

.info-grid {
  display: grid;
  /* main | metadata | QR | close - the close button is a real column, so it
     cannot land on top of the QR code the way an absolutely positioned one did. */
  grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr) auto auto;
  gap: 28px;
  padding: 22px 26px;
  height: 100%;
  align-items: start;
}

.info-title {
  margin: 0 0 10px;
  font-family: var(--font);
  font-size: clamp(20px, 2.2vw, 28px);
  font-weight: 700;
  line-height: 1.2;
}

.info-description {
  margin: 0 0 8px;
  font-size: 16px;
  line-height: 1.55;
  color: var(--ink-soft);
  max-height: 8.5em;
  overflow-y: auto;
}

.info-hint {
  margin: 0;
  font-size: 12px;
  color: var(--ink-faint);
}

/* Editable fields get a visible affordance only when editing is enabled. */
[contenteditable="true"] {
  outline: none;
  border-bottom: 1px dashed var(--line);
  cursor: text;
  -webkit-user-select: text;
  user-select: text;
}
[contenteditable="true"]:focus {
  border-bottom-color: var(--accent);
  background: var(--surface-2);
}

.info-meta { margin: 0; font-size: 14px; }

.meta-row {
  display: grid;
  grid-template-columns: 92px minmax(0, 1fr);
  gap: 10px;
  padding: 3px 0;
  align-items: baseline;
}

.meta-row dt { color: var(--ink-faint); font-size: 12px;
               text-transform: uppercase; letter-spacing: 0.06em; }

.meta-row dd {
  margin: 0;
  color: var(--ink-soft);
  /* This is the ellipsis behaviour the old sheet kept marking "REQUIRED". */
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Rows with no value hide themselves rather than showing a dash. */
.meta-row.is-empty { display: none; }

.info-qr { text-align: center; }

.qr-box {
  width: 132px;
  height: 132px;
  padding: 8px;
  border-radius: 10px;
  background: #fff;
  display: grid;
  place-items: center;
}
.qr-box img, .qr-box canvas { display: block; width: 100%; height: 100%; }

.qr-label {
  display: block;
  margin-top: 8px;
  font-size: 12px;
  color: var(--ink-faint);
}

.info-close {
  justify-self: end;
  padding: 8px 16px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--ink-soft);
  font-size: 13px;
  cursor: pointer;
}
.info-close:active { background: rgba(255, 255, 255, 0.16); }

/* ===========================================================================
 * Toolbar
 * =========================================================================*/

.toolbar {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: var(--z-toolbar);
  height: var(--toolbar-h);
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 14px;
  background: rgba(0, 0, 0, 0.62);
  backdrop-filter: blur(16px);
  border-top: 1px solid var(--line);
}

.tool-btn {
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  width: 56px;
  height: 56px;
  padding: 6px;
  border: 0;
  border-radius: 12px;
  background: transparent;
  cursor: pointer;
  transition: background 160ms ease, transform 120ms ease;
}
.tool-btn:active { transform: scale(0.92); background: var(--surface-2); }
.tool-btn.is-active { background: rgba(124, 184, 255, 0.22); }
.tool-btn img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }

/* Text fallback for a button whose icon failed to load. */
.tool-btn .tool-fallback {
  font-size: 11px;
  color: var(--ink-soft);
  text-align: center;
  line-height: 1.1;
}

/* The nameplate stretches to fill whatever space the buttons leave. */
.tool-nameplate {
  flex: 1 1 auto;
  min-width: 0;
  padding: 0 14px;
  font-family: var(--font);
  font-size: clamp(15px, 1.7vw, 22px);
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ===========================================================================
 * Toasts
 * =========================================================================*/

.toasts {
  position: absolute;
  top: 18px;
  left: 50%;
  transform: translateX(-50%);
  z-index: var(--z-toast);
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
  pointer-events: none;
  max-width: min(80vw, 560px);
}

.toast {
  padding: 10px 18px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(18, 22, 32, 0.9);
  backdrop-filter: blur(12px);
  color: var(--ink);
  font-size: 14px;
  text-align: center;
  opacity: 0;
  transform: translateY(-10px);
  transition: opacity 280ms ease, transform 280ms var(--transition-ease);
}
.toast.is-visible { opacity: 1; transform: translateY(0); }
.toast.is-error { border-color: rgba(255, 120, 120, 0.6); }

/* ===========================================================================
 * Banner - pause / offline status
 * =========================================================================*/

.banner {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  z-index: var(--z-banner);
  padding: 10px 18px;
  background: rgba(0, 0, 0, 0.78);
  backdrop-filter: blur(12px);
  color: var(--ink);
  font-size: 16px;
  text-align: center;
  transform: translateY(-100%);
  transition: transform 320ms var(--transition-ease);
}
.banner.is-visible { transform: translateY(0); }

/* ===========================================================================
 * Boot curtain
 * =========================================================================*/

.curtain {
  position: absolute;
  inset: 0;
  z-index: var(--z-curtain);
  display: grid;
  place-items: center;
  background: #000;
  opacity: 1;
  transition: opacity 700ms ease;
}
.curtain.is-hidden { opacity: 0; pointer-events: none; }

.curtain-inner { text-align: center; }

.spinner {
  width: 42px;
  height: 42px;
  margin: 0 auto 18px;
  border: 3px solid rgba(255, 255, 255, 0.16);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 900ms linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.curtain-text {
  margin: 0;
  color: var(--ink-faint);
  font-size: 15px;
  letter-spacing: 0.04em;
}

/* ===========================================================================
 * Developer HUD
 * =========================================================================*/

.hud {
  position: absolute;
  top: 8px;
  left: 8px;
  z-index: var(--z-hud);
  margin: 0;
  padding: 8px 12px;
  border-radius: 8px;
  background: rgba(0, 0, 0, 0.82);
  color: #7dff9b;
  font: 11px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
  white-space: pre;
  pointer-events: none;
}
.hud.is-warning { color: #ffd479; }
.hud.is-critical { color: #ff8f8f; }

/* ===========================================================================
 * Responsive + accessibility
 * =========================================================================*/

@media (max-width: 900px) {
  :root { --toolbar-h: 72px; }
  .info-grid { grid-template-columns: minmax(0, 1fr) auto auto; gap: 18px; padding: 18px; }
  .info-meta { display: none; }             /* title, description and QR only */
  .blurb { display: none; }
  .tool-btn { width: 46px; height: 46px; }
}

@media (max-width: 620px) {
  .info-qr { display: none; }
  .info-grid { grid-template-columns: minmax(0, 1fr) auto; }
  .caption { max-width: calc(100vw - 40px); }
}

/* Respect a viewer who has asked the OS for less motion. */
@media (prefers-reduced-motion: reduce) {
  .slide, .backdrop-img, .info-panel, .toast, .banner, .stage {
    transition-duration: 120ms !important;
  }
  .slide.from-right, .slide.from-left,
  .slide.to-left, .slide.to-right { transform: none; }
  .spinner { animation-duration: 2s; }
}

[hidden] { display: none !important; }
</style>
